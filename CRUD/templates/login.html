{% extends 'base.html' %}

{% block title %}Login | TaskFlow CRUD{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom auth-card shadow">
            <div class="auth-header">
                <i class="bi bi-shield-lock-fill fs-1 mb-2"></i>
                <h3 class="fw-bold mb-1">Welcome Back</h3>
                <p class="mb-0 text-white-50">Sign in to manage your tasks and items</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="identifier" class="form-label fw-semibold">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="identifier" name="identifier" value="{{ identifier or '' }}" placeholder="Enter username or email" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label text-muted" for="remember">Remember me on this device</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted mb-0">
                        Don't have an account yet? 
                        <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Sign up</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
